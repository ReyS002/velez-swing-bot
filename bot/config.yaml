timezone: US/Eastern
app:
  version: 0.1.0
  update_url: ''
  auto_check_updates: false
portfolio:
  initial_cash: 100000
broker:
  sim:
    enabled: true
    starting_cash: 100000
    slippage_bps: 1.0
    commission_per_share: 0.0
    commission_per_contract: 2.0
  mode: paper
  enable_live_trading: false
  slippage_bps: 1.0
  commission_per_share: 0.0
  commission_per_contract: 2.0
risk:
  risk_per_trade: 0.005
  max_dollar_risk_per_trade: 1000
  max_daily_loss_pct: 0.02
  max_consecutive_losses: 3
  max_open_positions: 7
  max_total_open_risk_pct: 0.02
  max_leverage: 2.0
  max_order_qty: 10000
  max_stop_pct: 0.05
  circuit_breaker_atr_pct: 0.05
  max_api_errors: 5
  pyramid_add_fraction: 0.5
  # Advisory planner warning threshold only; it never changes order routing.
  planner_max_spread_bps: 20
top_down:
  enabled: true
  profile: velez_intraday
  # advisory keeps Oliver/Velez setups available while adding market-wind readback.
  # size can reduce risk when top-down wind is opposed; gate requires explicit opt-in.
  mode: advisory
  cache_seconds: 300
  daily_lookback: 80
  weekly_lookback: 52
  fast_sma: 20
  slow_sma: 50
  slope_lookback: 5
  max_universe_symbols: 30
  breadth:
    symbols: [SPY, QQQ, IWM]
    supportive_min: 2
    hostile_min: 2
  sector_leadership:
    enabled: true
    lookback_bars: 20
  strategy_activation:
    enabled: true
    default_action: active
    advisory_min_multiplier: 0.5
bull_mentor:
  enabled: true
  weekly_days: 7
  minimum_performance_sample: 5
  slippage_warning_bps: 10
  chart_history_bars: 260
trade_readiness:
  # Advisory weights sum to 1. Missing evidence contributes no points and lowers confidence.
  weights:
    setup_quality: 0.18
    strategy_alignment: 0.12
    regime_alignment: 0.14
    reward_to_risk: 0.14
    risk_capacity: 0.14
    catalyst_context: 0.10
    data_freshness: 0.09
    guardrail_state: 0.09
decision_intelligence:
  minimum_performance_sample: 5
  minimum_discipline_sample: 5
  max_reviewed_trades_per_day: 5
post_trade_autopsy:
  enabled: true
  poll_seconds: 30
  timeframe: 5Min
mentor_voice_briefings:
  enabled: true
  morning_time: "08:00"
  evening_time: "16:15"
  dispatch_grace_minutes: 20
  weekends: false
webhook:
  auth_required: true
  secret_env: VELEZ_WEBHOOK_SECRET
  execute_orders: true
  paper_only: true
  time_in_force: gtc
  protective_stop_time_in_force: gtc
  take_profit_r: null
  dedupe_cache_size: 1000
strategy:
  sma_fast: 20
  sma_slow: 200
  atr_period: 14
  slope_lookback: 20
  ema_power: false
  ema_power_window: 9
  narrow_threshold: 0.004
  wide_threshold: 0.008
  narrow_bars: 10
  breakout_atr_mult: 1.5
  swing_lookback: 20
  breakout_mode: either
  momentum_atr_mult: 0.5
  elephant:
    enabled: false
    range_atr_mult: 1.5
    close_pos_pct: 0.7
  entry:
    use_limit: false
  exits:
    stop_type: atr
    stop_atr_mult: 2.0
    trail_type: atr
    trail_atr_mult: 2.5
    trail_debounce: 2
    partials:
      enabled: true
      first_r: 1.0
      second_r: 2.0
      first_pct: 0.5
      second_pct: 0.25
      move_stop_to_breakeven: true
    time_stop:
      enabled: true
      bars: 30
      min_move_atr: 1.0
  auto_flatten:
    enabled: true
    minutes_before_close: 15
  partials_auto_execute:
    enabled: true
    first_r: 1.0
    first_pct: 0.5
    second_r: 2.0
    second_pct: 0.25
  correlation:
    enabled: true
    max_correlation: 0.7
    factor_exposure:
      enabled: true
      # Beta-adjusted gross exposure prevents several different tickers from
      # silently becoming one concentrated market-direction bet.
      max_beta_adjusted_gross_pct: 1.25
      default_beta: 1.0
      betas: {SPY: 1.0, QQQ: 1.2, IWM: 1.1, TQQQ: 3.0, NVDA: 1.7, AMD: 1.8, MU: 1.6, GOOGL: 1.1, AMZN: 1.2, MSFT: 1.0, NFLX: 1.3, HOOD: 1.5, HIMS: 1.4, OSCR: 1.3}
    sector_groups:
      semiconductors: ["NVDA", "AMD", "INTC", "MU", "AVGO", "TSM", "QCOM", "ARM", "SMCI"]
      mega_tech: ["GOOGL", "AMZN", "MSFT", "AAPL", "META"]
      consumer_tech: ["TSLA"]
      indices: ["SPY", "QQQ"]
      crypto: ["BTC", "ETH/USD", "SOL/USD", "ADA/USD", "XRP/USD", "TEL/USD"]
      forex: ["EUR/USD", "GBP/JPY", "USD/JPY", "USD/CAD", "JPY/USD"]
scanner:
  enabled: true
  auto_submit: true
  symbols: ["SPY", "QQQ", "NVDA", "MSFT", "AAPL", "AMD", "TSLA", "AMZN", "META", "GOOGL", "MU", "AVGO", "INTC", "TSM", "QCOM", "ARM", "SMCI"]
  interval_seconds: 900
  pause_when_exposure_full: true
  session_filter_enabled: true
  rth_start: "09:35"
  rth_end: "15:45"
  avoid_lunch: true
  lunch_start: "11:45"
  lunch_end: "13:30"
velez_strategy:
  sma_fast: 20
  sma_slow: 200
  atr_period: 14
  slope_lookback: 5
  vwap:
    # Advisory confluence for existing Oliver Velez setups. No VWAP rule can
    # block, size, route, submit, or exit a trade by default.
    enabled: true
    bias_enabled: true
    scoring_enabled: true
    setup_confluence_enabled: true
    hard_filter_enabled: false
    session_vwap: true
    weekly_vwap: false
    anchored_vwap: false
    primary_variant: session
    timezone: America/New_York
    market_session: equity_rth
    include_extended_hours: false
    session_open: "09:30"
    session_close: "16:00"
    slope_lookback: 5
    reclaim_confirmation_bars: 2
    bounce_confirmation_bars: 2
    score:
      above_vwap: 5
      aligned_slope: 3
      reclaim: 4
      bounce: 4
      rejection: 4
      strong_disagreement_penalty: -5
      flat_choppy_penalty: -3
      excessive_extension_penalty: -3
    thresholds:
      neutral_distance_pct: 0.001
      compression_distance_atr: 0.20
      compression_distance_pct: 0.001
      compression_crosses: 2
      compression_lookback: 5
      extension_distance_atr: 1.50
      extension_distance_pct: 0.015
      slope_flat_atr_fraction: 0.02
      slope_flat_price_pct: 0.0001
  history_bars: 240
  near_sma_pct: 0.0025
  near_sma_atr_mult: 0.35
  extended_sma_pct: 0.012
  extended_sma_atr_mult: 1.0
  slope_tolerance: 1.0e-09
  tick_size:
    default: 0.01
  entry:
    no_chase_body_pct: 0.05
  elephant:
    enabled: true
    body_lookback: 5
    structure_lookback: 5
    min_body_mult: 1.8
    max_each_wick_pct: 0.2
    max_total_wick_pct: 0.35
    climactic_body_mult: 3.0
    climactic_atr_mult: 2.2
  one_eighty:
    enabled: true
    recover_pct: 0.8
  tail:
    enabled: true
    min_tail_pct: 0.66
    trend_bars: 3
    prefer_tail_limit: true
  lower_tf_filters:
    enabled: true
    volume_mult: 1.5
    bar_range_mult: 1.0
    trend_alignment: true
    lookback_bars: 20
    higher_tf: "15m"
  trifecta:
    enabled: true
    chains:
      "2": ["5", "15"]
      "5": ["15"]
      "60": ["240", "D"]
      "240": ["D"]
  webhook_confluence:
    enabled: true
    default_signal_timeframe: "15"
    higher_timeframes: ["60", "240"]
    conflict_starter_multiplier: 0.25
    skip_signal_trend_conflict: true
    # An unavailable higher timeframe can never promote an order to full size.
    unavailable_higher_timeframe_action: starter
    unavailable_starter_multiplier: 0.25
    max_bar_age_minutes: {"15": 35, "60": 95, "240": 300}
