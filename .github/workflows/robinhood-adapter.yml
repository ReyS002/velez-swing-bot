name: Robinhood Adapter

on:
  push:
    branches: ["codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest requests
      - run: python -m compileall -q bot/brokers/robinhood.py bot/webhook_server.py
      - run: python -m pytest -q bot/tests/test_robinhood_broker.py
